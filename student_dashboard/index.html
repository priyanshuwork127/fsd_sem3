1.Display a list of student
2.Add a new student using a form
3.Search student by name
4.Filter student by branch
5.Delete a student
6.Show total no of student
7.Display "no record found" -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
</head>
<body>
    <div style="justify-content: center;text-align:center;color:yellow;background-color: black;">
        <h1>Welcome to CSE department</h1>
        <h2>Student Dashboard</h2>
    </div>
    <div style="display: flex;justify-content: center;align-items: center;">
        <div style="width: 50%;margin-top: 20px;">
            <form id="studentForm">
                <input type="text" id="name" placeholder="Enter Name" required>
                <input type="text" id="branch" placeholder="Enter Branch" required>
                <input type="text" id="roll no" placeholder="Enter roll no" required>
                <button type="submit" onclick="addStudent(event)">Add Student</button>
            </form>
        </div>
    </div>
    <div style="display: flex;justify-content: center;align-items: center;">
        <div style="width: 50%;margin-top: 20px;">
            <select id="filter">
                <option value="">Filter by Branch</option>
                <option value="DS">DS</option>
                <option value="CORE">CORE</option>
                <option value="AI ML">AI ML</option>
            </select> 
            <button type="submit" onclick="filterStudents()">filter</button>
        </div>
    </div>
    <div style="display:flex;justify-content: center;align-items: center;">
        <div style="width: 50%;margin-top: 20px;">
            <form id="deleteStudentForm">
                <input type="text" id="dname" placeholder="Enter Name to Delete" required>
                <button type="submit" onclick="deleteStudent(event)">Delete Student</button>
            </form>
        </div>
    </div>              
    <div style="display: flex;justify-content: center;align-items: center;">
        <div style="width: 50%;margin-top: 20px;">
            <table border="1" style="width: 100%;">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Branch</th>   
                        <th>Roll no</th>
                        
                    </tr>   
                </thead>
                <tbody id="studentList">

                </tbody>
                </table>
                </div>
                </div>
</body>
<script>
    function addStudent(event) {
        event.preventDefault();
        const name = document.getElementById('name').value;
        const branch = document.getElementById('branch').value;
        const rollNo = document.getElementById('roll no').value;

        const studentList = document.getElementById('studentList');
        const newRow = studentList.insertRow();
        newRow.insertCell(0).innerText = name;
        newRow.insertCell(1).innerText = branch;
        newRow.insertCell(2).innerText = rollNo;

        // Clear the form
        document.getElementById('studentForm').reset();
    }

    function filterStudents() {
        const filterValue = document.getElementById('filter').value.toLowerCase();
        const rows = document.getElementById('studentList').rows;

        for (let i = 0; i < rows.length; i++) {
            const branchCell = rows[i].cells[1].innerText.toLowerCase();
            if (filterValue === "" || branchCell === filterValue) {
                rows[i].style.display = "";
            } else {
                rows[i].style.display = "none";
            }
        }
    }
    function deleteStudent(event) {
        event.preventDefault();
        const dname = document.getElementById('dname').value.toLowerCase();
        const studentList = document.getElementById('studentList');
        let found = false;

        for (let i = 0; i < studentList.rows.length; i++) {
            const nameCell = studentList.rows[i].cells[0].innerText.toLowerCase();
            if (nameCell === dname) {
                studentList.deleteRow(i);
                found = true;
                break;
            }
        }

        if (!found) {
            alert("No record found");
        }


        document.getElementById('delete student').reset();
    }
</script>
</html>
