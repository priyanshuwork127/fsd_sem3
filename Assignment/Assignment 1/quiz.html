
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 1</title>
    <link rel="stylesheet" href="style.css">
</head>

<body >

    <h1 >Quiz</h1>

    <form>

        <label for="name">Name:</label>
        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
        />

        <br><br>

        <label for="rollno">Roll no:</label>
        <input
            type="number"
            id="rollno"
            placeholder="Enter your roll number"
            required
        />

        <br><br>

        <label for="branch">Branch:</label>
        <select id="branch" required>
            <option value="">Select branch:</option>
            <option value="cse">CSE</option>
            <option value="cse-ds">CSE DS</option>
            <option value="cse-ai-ml">CSE AI ML</option>
        </select>

        <br><br>

        <label for="section">Section:</label>
        <select id="section" required>
            <option value="">Select Section:</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
        </select>

    </form>

    <br><br><br>

    <h2>Instruction:</h2>

    <h3>Read every question carefully before choosing an answer.</h3>

    <h3>
        Note whether the format uses multiple-choice,
        true/false, or short-answer prompts.
    </h3>

    <h3>
        Pay attention to point values shown for each individual question.
    </h3>

    <br><br>

    <a href="questions.html">
        <button type="button">Next</button>
    </a>

    <script src="index.js"></script>

</body>

</html>
