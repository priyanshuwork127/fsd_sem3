<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Questions</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="question">

        <h1>Quiz</h1>

        <h3 id="Qno">Question no: 1</h3>

        <p id="quest"></p>

        <div id="question-box">

            <div class="option" id="option1"></div>

            <div class="option" id="option2"></div>

            <div class="option" id="option3"></div>

            <div class="option" id="option4"></div>

        </div>

        <div id="buttons">
            <button id="next">Next Question</button>
            <button id="submit">Submit Quiz</button>
        </div>

        <p id="keyboard-info">
            Use <b>1, 2, 3, 4</b> to select an option |
            Press <b>Enter</b> for next question
        </p>

    </div>

    <script src="index.js"></script>

</body>
</html>
